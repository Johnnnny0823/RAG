name: Official patent E2E
on:
  workflow_dispatch:
    inputs:
      coverage:
        description: "Choose source checks or the full model and browser suite"
        type: choice
        options: [full, source]
        default: full

permissions:
  contents: read

jobs:
  official-patent:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME: patentscope-tipo-e2e
      EMBEDDING_URL: http://ollama:11434
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      EMBEDDING_DIGEST: ac6da0dfba84a81fdbfbaf330198c33cd77c4cdfc53e8bc50eb581914a15621d
      ANALYSIS_URL: http://ollama:11434
      ANALYSIS_MODEL: qwen2.5:1.5b
      ANALYSIS_DIGEST: 65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - name: Restore pinned public TIPO fixtures
        id: tipo-fixtures
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/tipo-fixture/*.xml
            ${{ runner.temp }}/tipo-fixture/objects/download-cache
          key: ${{ runner.os }}-tipo-public-xml-${{ hashFiles('scripts/seed_tipo_e2e.py') }}
      - name: Prepare and verify official fixture checksums
        timeout-minutes: 30
        run: python -m scripts.seed_tipo_e2e "$RUNNER_TEMP/tipo-fixture" --prepare-only
      - name: Save verified public TIPO fixtures
        if: steps.tipo-fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/tipo-fixture/*.xml
            ${{ runner.temp }}/tipo-fixture/objects/download-cache
          key: ${{ steps.tipo-fixtures.outputs.cache-primary-key }}
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start packaged web and private API
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.deploy.yml up -d --build --wait --wait-timeout 180
      - name: Verify packaged web deployment
        run: python scripts/smoke.py --api http://127.0.0.1:5173 --web http://127.0.0.1:5173 --deployment
      - name: Import and verify cached official corpus
        run: python -m scripts.seed_tipo_e2e "$RUNNER_TEMP/tipo-fixture" --offline --skip-semantic
      - name: Official identifiers, provenance and lexical search APIs
        run: |
          python scripts/smoke_patents.py --official-e2e --api http://127.0.0.1:5173
          python scripts/smoke_lexical.py --official-e2e --api http://127.0.0.1:5173
      - name: Official identifier lookup in Chromium
        run: npm run test:e2e --prefix apps/web -- patent-number.spec.ts
        env:
          PATENTSCOPE_E2E_TIPO: versions
          PATENTSCOPE_E2E_URL: http://127.0.0.1:5173
      - name: Start isolated CPU model server
        if: inputs.coverage == 'full'
        run: |
          docker run -d --name patentscope-tipo-ollama --network patentscope-tipo-e2e_default --network-alias ollama ollama/ollama@sha256:2c9595c555fd70a28363489ac03bd5bf9e7c5bdf2890373c3a830ffd7252ce6d
          timeout 60 bash -c 'until docker exec patentscope-tipo-ollama ollama list; do sleep 2; done'
          docker exec patentscope-tipo-ollama ollama pull "$EMBEDDING_MODEL"
          docker exec patentscope-tipo-ollama ollama pull "$ANALYSIS_MODEL"
      - name: Build official semantic index
        if: inputs.coverage == 'full'
        run: docker compose --env-file .env.example run --rm --no-deps migrate python -m services.retrieval.index_semantic --batch-size 2 --request-timeout 180
      - name: Official semantic search API
        if: inputs.coverage == 'full'
        run: python scripts/smoke_semantic.py --official-e2e --api http://127.0.0.1:5173
      - run: npx playwright install --with-deps firefox webkit
        if: inputs.coverage == 'full'
        working-directory: apps/web
      - name: Official full text, evidence, history and PDF
        if: inputs.coverage == 'full'
        run: npm run test:e2e --prefix apps/web
        env:
          PATENTSCOPE_E2E_TIPO: "1"
          PATENTSCOPE_E2E_CROSS_BROWSER: "1"
          PATENTSCOPE_E2E_URL: http://127.0.0.1:5173
      - name: Publication and grant versions, pagination and reranking
        if: inputs.coverage == 'full'
        run: npm run test:e2e --prefix apps/web -- patent-versions.spec.ts search-pagination.spec.ts search-rerank.spec.ts
        env:
          PATENTSCOPE_E2E_TIPO: versions
          PATENTSCOPE_E2E_URL: http://127.0.0.1:5173
      - name: Verify deployment rate limits
        run: python scripts/smoke.py --api http://127.0.0.1:5173 --web http://127.0.0.1:5173 --deployment --deployment-rate-limit
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: tipo-e2e-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - if: failure()
        run: docker compose --env-file .env.example logs --no-color
