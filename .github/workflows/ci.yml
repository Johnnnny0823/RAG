name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: patentscope-ci
      POSTGRES_DB: patentscope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest -q
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait --wait-timeout 180
      - run: python -m pytest -q tests/integration
        env:
          PATENTSCOPE_PG_INTEGRATION: "1"
          PGHOST: 127.0.0.1
          PGPORT: "15432"
          PGDATABASE: patentscope_test
          PGUSER: patentscope
          PGPASSWORD: dev_only_change_me
      - run: python scripts/smoke.py
      - run: npm run test:e2e --prefix apps/web
        env:
          PATENTSCOPE_E2E_URL: http://127.0.0.1:5173
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color
