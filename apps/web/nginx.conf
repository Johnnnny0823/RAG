map "$request_method:$uri" $auth_rate_key {
    default "";
    ~^POST:/api/v1/auth/(login|register)/?$ $binary_remote_addr;
    ~^DELETE:/api/v1/me/?$ $binary_remote_addr;
}

map "$request_method:$uri" $research_rate_key {
    default "";
    ~^POST:/api/v1/(queries/analyze|patents/search(/(semantic|hybrid))?|search-jobs|search-runs)/?$ $binary_remote_addr;
    ~^POST:/api/v1/(patents/[^/]+/compare|sessions/[^/]+/messages)/?$ $binary_remote_addr;
    ~^POST:/api/v1/search-runs/[^/]+/(comparisons/[^/]+|reports)/?$ $binary_remote_addr;
    ~^GET:/api/v1/search-runs/[^/]+/report\.pdf/?$ $binary_remote_addr;
    ~^GET:/api/v1/me/export/?$ $binary_remote_addr;
    ~^GET:/api/v1/corpus/status/?$ $binary_remote_addr;
    ~^POST:/api/v1/patents/gazette-pdfs/search/?$ $binary_remote_addr;
}

limit_req_zone $auth_rate_key zone=auth_per_ip:1m rate=30r/m;
limit_req_zone $research_rate_key zone=research_per_ip:1m rate=120r/m;

server {
    listen 5173;
    include /etc/nginx/patentscope-tls/*.conf;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    location /api/v1/ {
        limit_req zone=auth_per_ip burst=6 nodelay;
        limit_req zone=research_per_ip burst=12 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 = @rate_limited;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_buffering off;
        access_log off;
    }

    location @rate_limited {
        default_type application/json;
        access_log off;
        add_header_inherit merge;
        add_header Cache-Control no-store always;
        add_header Retry-After 2 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"請求次數過多，請稍後重試。"}}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        add_header_inherit merge;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
}
